name: Security Scan

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  bandit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Bandit
        run: |
          python -m pip install --upgrade pip
          pip install bandit

      # Gated at HIGH severity + HIGH confidence (-lll -iii), which is the
      # actionable subset the Sage security scan reports on (see SEC-419).
      # Tightening to -ll -ii is a follow-up, once the existing medium/low
      # findings have been triaged.
      - name: Run Bandit (high severity, high confidence)
        run: bandit -c bandit.yaml -r src/ scripts/ tools/ -lll -iii
